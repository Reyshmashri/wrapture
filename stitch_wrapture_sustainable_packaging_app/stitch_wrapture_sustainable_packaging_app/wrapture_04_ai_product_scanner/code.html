kdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(43,43,40,0.03)]"><div class="h-16 px-gutter-mobile flex items-center justify-between gap-space-sm"><div class="flex items-center gap-space-sm min-w-0"><button aria-label="Go back" class="min-w-[44px] min-h-[44px] flex items-center justify-center text-primary hover:text-on-surface-variant transition-colors -ml-2" onclick="history.back()"><span class="material-symbols-outlined text-[22px]">arrow_back</span></button><img alt="Official WRAPTURE Primary Brandmark: The Origami Vessel. An architectural continuous fold formed by an enveloping structural substrate in Olive Forest and Sage Green, revealing a razor-sharp negative space botanical leaf aperture through the crease. Scalable, distinct silhouette, zero hexagons or cubes." class="h-8 w-auto object-contain shrink-0" src="https://lh3.googleusercontent.com/aida/AEtjO1V6mPqc2YQJZaecy_xQsaWXbVodl20zBQl98cL7PDme1WjxjSSKiJvN0MLxYxzYpht69mY0pl1kFaYIGrJjbf5B_jpOK_2DZHJ3nz8Oat8jt1Ovz_BdkqupgH8OKEMZwAocPnxErRke3RjlG_ByEpt5y5b6azXH7bN_0Ii5BGlhpyi0jQm-nDX8uQ_SAy-N8Ak0wPSDMF8MY5sfps5-qU2YPU63h2xKYVtpmiHvngeaTcpjRQqOwB31pxH3"><h1 class="font-headline-sm text-body-lg text-primary truncate leading-tight">Ai Product Scanner</h1></div><div class="flex items-center gap-space-xs shrink-0"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 flex flex-col relative w-full pt-16 pb-safe bg-surface"><div class="flex flex-col w-full relative">
<!-- Interactive Viewfinder Camera Screen Container -->
<div class="relative w-full rounded-2xl overflow-hidden bg-primary-container shadow-2xl flex flex-col justify-between" style="min-height: calc(100vh - 6rem);">
<!-- Camera Viewport Feed (Realistic Product Shot) -->
<div class="absolute inset-0 z-0">
<img class="w-full h-full object-cover object-center transform scale-105" data-alt="A clean, minimalist brushed stainless steel reusable water bottle standing elegantly on an earthy textured limestone slab beside compostable molded pulp packaging and an organic eucalyptus branch. High fashion sustainable packaging studio photography, soft warm natural directional sunlight casting architectural shadows, premium organic olive green and warm sand tones, ultra high resolution." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDjAGX85sSoJHpPoHEjIBA4cY6VStFMoFWLfng4shQVhQ_RKgYINi_wnHuwBWJgDIdsRhtHly8aKnN8suADp2kaJTQKEXQKvLNQaPQGDCQDQvd42OxDlVpGDwMNpNvQ4yFFiB3F0g-38IMHwIRQeMFYBIPawf-p2cgjvP5P6--7iH7_3JRMkioHXjDaBpKJBmnpbQwYXhcugymxBrLf4Brv6bvItZYVoeURuhiz0jIKFBVIQpXJK_vqyQ">
<!-- Atmospheric Vignette & Spatial Sensor Shader Gradients -->
<div class="absolute inset-0 bg-gradient-to-b from-primary/80 via-primary/20 to-primary/95 pointer-events-none"></div>
<div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-transparent via-primary/30 to-primary/80 pointer-events-none"></div>
</div>
<!-- Top HUD Camera Action Bar -->
<div class="relative z-20 flex items-center justify-between px-5 pt-4 pb-2"><div class="flex items-center gap-2"><button aria-label="Toggle Torch" class="w-10 h-10 rounded-full bg-surface/20 backdrop-blur-md text-surface flex items-center justify-center transition-all active:scale-95 shadow-md" id="torch-btn" onclick="toggleTorch()"><span class="material-symbols-outlined text-[20px]" id="torch-icon">flash_on</span></button><span class="px-3 py-1 rounded-full bg-surface/15 backdrop-blur-md text-surface text-[11px] font-medium tracking-wide uppercase flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-secondary-fixed animate-pulse"></span>Auto Scan</span></div><div class="flex items-center gap-2"><button aria-label="Flip Camera" class="w-10 h-10 rounded-full bg-surface/20 backdrop-blur-md text-surface flex items-center justify-center transition-all active:scale-95 shadow-md" onclick="flipCamera()"><span class="material-symbols-outlined text-[20px]">flip_camera_ios</span></button></div></div>
<!-- Central Augmented Reality Optical Reticle & Measurement Calipers -->
<div class="relative z-10 flex-1 flex flex-col items-center justify-center px-6 py-4 pointer-events-none">
<!-- Reticle Wrapper matching Bottle Proportions -->
<div class="relative w-64 max-w-[70vw] h-[340px] flex items-center justify-center transition-transform duration-300" id="reticle-box"><!-- Top Floating Status Card / Confidence Pill --><div class="absolute -top-14 inset-x-0 flex items-center justify-center pointer-events-auto"><div class="bg-surface-bright/95 backdrop-blur-lg px-4 py-1.5 rounded-full shadow-lg flex items-center gap-2"><span class="relative flex h-2 w-2"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-secondary opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-secondary"></span></span><span class="text-primary text-[11px] font-semibold tracking-wider uppercase font-body-md">Product Detected</span><span class="text-primary/40 text-[10px]">·</span><span class="text-[11px] font-medium text-secondary tracking-wide font-mono">94% CONFIDENCE</span></div></div><!-- Architectural Corner Accents --><div class="absolute -top-1 -left-1 w-7 h-7 flex flex-col justify-start items-start"><span class="w-7 h-[2px] bg-secondary-fixed shadow-[0_0_8px_rgba(203,235,198,0.8)]"></span><span class="w-[2px] h-7 bg-secondary-fixed shadow-[0_0_8px_rgba(203,235,198,0.8)]"></span></div><div class="absolute -top-1 -right-1 w-7 h-7 flex flex-col justify-start items-end"><span class="w-7 h-[2px] bg-secondary-fixed shadow-[0_0_8px_rgba(203,235,198,0.8)]"></span><span class="w-[2px] h-7 bg-secondary-fixed shadow-[0_0_8px_rgba(203,235,198,0.8)]"></span></div><div class="absolute -bottom-1 -left-1 w-7 h-7 flex flex-col justify-end items-start"><span class="w-[2px] h-7 bg-secondary-fixed shadow-[0_0_8px_rgba(203,235,198,0.8)]"></span><span class="w-7 h-[2px] bg-secondary-fixed shadow-[0_0_8px_rgba(203,235,198,0.8)]"></span></div><div class="absolute -bottom-1 -right-1 w-7 h-7 flex flex-col justify-end items-end"><span class="w-[2px] h-7 bg-secondary-fixed shadow-[0_0_8px_rgba(203,235,198,0.8)]"></span><span class="w-7 h-[2px] bg-secondary-fixed shadow-[0_0_8px_rgba(203,235,198,0.8)]"></span></div><!-- Subtle Center Focus Crosshair --><div class="w-full h-full flex items-center justify-center opacity-20"><div class="w-10 h-10 rounded-full border-dashed border-surface-tint"></div><div class="absolute w-4 h-[1px] bg-surface"></div><div class="absolute h-4 w-[1px] bg-surface"></div></div><!-- Gentle Scanning Horizon Line --><div class="absolute inset-x-2 h-1 bg-gradient-to-r from-transparent via-secondary-fixed to-transparent opacity-80 blur-[1px] shadow-[0_0_12px_#cbebc6] animate-[bounce_3s_ease-in-out_infinite]"></div><!-- Lower Metadata Badge Cluster --><div class="absolute -bottom-12 inset-x-0 flex justify-center items-center gap-2 flex-wrap pointer-events-auto"><span class="bg-primary/90 backdrop-blur-md text-surface-bright text-[11px] font-medium px-3 py-1 rounded-full shadow-md flex items-center gap-1.5"><span class="material-symbols-outlined text-[13px] text-secondary-fixed">science</span>Stainless Steel</span><span class="bg-primary/90 backdrop-blur-md text-surface-bright text-[11px] font-medium px-3 py-1 rounded-full shadow-md flex items-center gap-1.5"><span class="material-symbols-outlined text-[13px] text-secondary-fixed">scale</span>0.6 kg</span><span class="bg-primary/90 backdrop-blur-md text-surface-bright text-[11px] font-medium px-3 py-1 rounded-full shadow-md flex items-center gap-1.5"><span class="material-symbols-outlined text-[13px] text-secondary-fixed">local_cafe</span>Drinkware</span></div></div>
</div>
<!-- Bottom Controls & Camera Deck -->
<div class="relative z-20 w-full bg-gradient-to-t from-primary via-primary/90 to-transparent pt-6 pb-6 px-6 flex flex-col items-center gap-4">
<!-- Mode Switcher Pill -->
<div class="bg-surface/15 backdrop-blur-lg p-1 rounded-full flex items-center gap-1 shadow-inner">
<button class="mode-tab px-4 py-1 rounded-full text-[12px] font-medium text-surface/80 transition-all hover:text-surface" onclick="setScanMode(this, 'photo')">
          Photo
        </button>
<button class="mode-tab px-4 py-1 rounded-full text-[12px] font-semibold bg-surface-bright text-primary shadow transition-all" onclick="setScanMode(this, 'auto')">
          Auto
        </button>
<button class="mode-tab px-4 py-1 rounded-full text-[12px] font-medium text-surface/80 transition-all hover:text-surface" onclick="setScanMode(this, 'manual')">
          Manual
        </button>
</div>
<!-- Trigger Deck: Gallery Upload, Shutter, Presets -->
<div class="w-full max-w-sm flex items-center justify-between px-4 pt-1">
<!-- Upload Gallery Thumbnail -->
<div class="flex flex-col items-center gap-1">
<label class="w-12 h-12 rounded-xl bg-surface/20 backdrop-blur-md hover:bg-surface/30 active:scale-95 transition-all flex items-center justify-center cursor-pointer shadow-lg">
<input accept="image/*" class="hidden" onchange="simulateScan(this)" type="file">
<div class="w-8 h-8 rounded-lg overflow-hidden bg-primary relative flex items-center justify-center">
<span class="material-symbols-outlined text-surface text-[20px]">photo_library</span>
</div>
</label>
<span class="text-[10px] text-surface/80 font-medium tracking-wide">Gallery</span>
</div>
<!-- Tactile Main Shutter Button -->
<button aria-label="Capture Scan" class="relative group p-1.5 rounded-full flex items-center justify-center transition-transform active:scale-90" id="shutter-btn" onclick="captureProduct()">
<!-- Outer Pulsing Glow -->
<div class="absolute inset-0 rounded-full bg-secondary-fixed/40 blur-md group-hover:bg-secondary-fixed/60 transition-colors"></div>
<!-- Tactile Ivory Ring -->
<div class="relative w-20 h-20 rounded-full bg-surface-bright flex items-center justify-center shadow-[0_8px_24px_rgba(0,0,0,0.35)]">
<!-- Inner Deep Olive Core -->
<div class="w-16 h-16 rounded-full bg-primary flex items-center justify-center transition-all group-active:scale-95">
<div class="w-14 h-14 rounded-full bg-secondary-fixed/20 flex items-center justify-center">
<span class="material-symbols-outlined text-secondary-fixed text-[26px]">document_scanner</span>
</div>
</div>
</div>
</button>
<!-- Quick Material Preset Filter Toggle -->
<div class="flex flex-col items-center gap-1">
<button aria-label="Presets" class="w-12 h-12 rounded-xl bg-surface/20 backdrop-blur-md hover:bg-surface/30 active:scale-95 transition-all flex items-center justify-center text-surface shadow-lg" onclick="togglePresetMenu()">
<span class="material-symbols-outlined text-[22px]">tune</span>
</button>
<span class="text-[10px] text-surface/80 font-medium tracking-wide">Filters</span>
</div>
</div>
<!-- Helper Guidance Line -->
<p class="text-surface/80 text-[12px] tracking-wide font-normal flex items-center gap-1.5 pt-1" id="guidance-text"><span class="material-symbols-outlined text-[15px] text-secondary-fixed">center_focus_strong</span>Position the product within the frame</p>
</div>
<!-- Optical Flash Feedback Overlay -->
<div class="absolute inset-0 bg-surface-lowest opacity-0 pointer-events-none transition-opacity duration-150 z-50" id="flash-overlay"></div>
</div>
<!-- Interactive JavaScript Handling Scan Delight Feedback -->
<script>
    let torchActive = false;
    function toggleTorch() {
      torchActive = !torchActive;
      const icon = document.getElementById('torch-icon');
      const btn = document.getElementById('torch-btn');
      if (torchActive) {
        icon.innerText = 'flashlight_off';
        btn.classList.add('bg-secondary-fixed', 'text-on-secondary-fixed');
        btn.classList.remove('bg-surface/20', 'text-surface');
      } else {
        icon.innerText = 'flashlight_on';
        btn.classList.remove('bg-secondary-fixed', 'text-on-secondary-fixed');
        btn.classList.add('bg-surface/20', 'text-surface');
      }
    }

    function setScanMode(target, mode) {
      document.querySelectorAll('.mode-tab').forEach(el => {
        el.className = 'mode-tab px-4 py-1 rounded-full text-[12px] font-medium text-surface/80 transition-all hover:text-surface';
      });
      target.className = 'mode-tab px-4 py-1 rounded-full text-[12px] font-semibold bg-surface-bright text-primary shadow transition-all';
      
      const helper = document.getElementById('guidance-text');
      if (mode === 'photo') {
        helper.innerHTML = '<span class="material-symbols-outlined text-[15px] text-secondary-fixed">photo_camera</span> Tap shutter to capture high-res frame';
      } else if (mode === 'auto') {
        helper.innerHTML = '<span class="material-symbols-outlined text-[15px] text-secondary-fixed">center_focus_strong</span> LiDAR lock active. Auto-measuring volume';
      } else {
        helper.innerHTML = '<span class="material-symbols-outlined text-[15px] text-secondary-fixed">handyman</span> Drag brackets to define exact geometry';
      }
    }

    function cycleGrid() {
      const box = document.getElementById('reticle-box');
      box.classList.toggle('scale-95');
    }

    function flipCamera() {
      const reticle = document.getElementById('reticle-box');
      reticle.classList.add('rotate-6');
      setTimeout(() => reticle.classList.remove('rotate-6'), 200);
    }

    function togglePresetMenu() {
      const helper = document.getElementById('guidance-text');
      helper.innerText = "Target preset: Sustainable Rigid Packaging (FSC/Alu)";
      setTimeout(() => {
        helper.innerText = "Position the product within the reticle frame";
      }, 2500);
    }

    function simulateScan(input) {
      if (input.files && input.files[0]) {
        captureProduct();
      }
    }

    function captureProduct() {
      const flash = document.getElementById('flash-overlay');
      flash.classList.remove('opacity-0');
      flash.classList.add('opacity-80');
      
      if (navigator.vibrate) {
        navigator.vibrate([40, 20, 40]);
      }

      setTimeout(() => {
        flash.classList.remove('opacity-80');
        flash.classList.add('opacity-0');
      }, 120);

      const helper = document.getElementById('guidance-text');
      helper.innerHTML = '<span class="material-symbols-outlined text-[15px] text-secondary-fixed">check_circle</span> 3D Volumetric Mesh Calculated (350ml)';
    }
  </script>
</div></main>

</body></html>
