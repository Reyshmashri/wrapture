<!DOCTYPE html><html lang="en" style=""><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&amp;family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&amp;family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "secondary-fixed": "#cbebc6", "inverse-surface": "#31302d", "secondary-container": "#c9e8c3", "surface-container-high": "#eae8e3", "surface-container": "#f0ede9", "tertiary-fixed-dim": "#fbb790", "primary-container": "#2e4a3a", "secondary": "#4a6548", "on-secondary": "#ffffff", "on-tertiary-fixed": "#321200", "surface-variant": "#e5e2dd", "tertiary": "#4b2307", "on-primary-container": "#9ab9a4", "on-primary-fixed": "#042013", "on-error": "#ffffff", "background": "#fcf9f4", "inverse-primary": "#aeceb9", "on-surface": "#1c1c19", "surface-bright": "#fcf9f4", "on-primary": "#ffffff", "on-error-container": "#93000a", "tertiary-fixed": "#ffdbc9", "on-secondary-fixed": "#072109", "primary-fixed": "#caead4", "surface-dim": "#dcdad5", "on-tertiary-container": "#e4a27d", "tertiary-container": "#66381a", "on-secondary-fixed-variant": "#324d32", "surface-tint": "#486553", "error": "#ba1a1a", "inverse-on-surface": "#f3f0eb", "on-tertiary-fixed-variant": "#693b1d", "on-surface-variant": "#424843", "on-primary-fixed-variant": "#314d3d", "primary": "#183325", "on-tertiary": "#ffffff", "surface-container-low": "#f6f3ee", "outline-variant": "#c2c8c1", "on-background": "#1c1c19", "surface": "#fcf9f4", "surface-container-highest": "#e5e2dd", "surface-container-lowest": "#ffffff", "on-secondary-container": "#4e6a4c", "outline": "#727973", "primary-fixed-dim": "#aeceb9", "secondary-fixed-dim": "#b0cfab", "error-container": "#ffdad6" }, "borderRadius": { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" }, "spacing": { "margin": "3rem", "space-lg": "1.75rem", "space-xs": "0.25rem", "space-md <body class="w-full h-full text-on-surface font-body-md relative overflow-hidden select-none">
<!-- Immersive Full-Bleed Photographic Background Layer -->
<div class="absolute inset-0 w-full h-full z-0 overflow-hidden">
<img alt="Wrapture bespoke sustainable kraft packaging hero" class="w-full h-full object-cover object-center pointer-events-none" src="https://lh3.googleusercontent.com/aida/AEtjO1VjWn7Gz_vS9OeIxDN5Zi2DoLd4rmlZaO1TRuz_-Rgr1lpLlhaoV7wP6Gj-D74TbCxNke796XX59PEUUuci500V__w_YmUoJJZ17-PeHB5kI8uUtG_0E5HOz1WjnJwl8ExBkYA2JmpZjLtR3Dg5w0FS0ilZ7poHbaRs5EEFBYe3mXSleGHMsnptoO7eokibcN7mLDUkMUN-Mk1rmGm4HxpbP4ESiIgssfFVtMTD9Kx3mtCRLyZE4IWJvLY">
<!-- Subtle, delicate sunlight & contrast scrims that maintain photographic purity -->
<div class="absolute inset-0 bg-gradient-to-b from-[#FAF7F1]/55 via-transparent via-40% to-[#183325]/35 pointer-events-none"></div>
<div class="absolute inset-x-0 top-0 h-44 bg-gradient-to-b from-[#FAF7F1]/70 to-transparent pointer-events-none"></div>
</div>
<!-- Content Layer: Seamless Editorial Mobile Splash Layout -->
<main class="relative z-10 flex flex-col justify-between w-full h-full pt-safe pb-safe px-6">
<!-- Top Area: Brand Lockup & Asymmetrical Statement in Upper Negative Space -->
<header class="flex flex-col w-full"><!-- Brandmark: Geometric folded leaf icon + serif WRAPTURE lockup -->
<div class="flex items-center space-x-3.5">
  <svg class="w-[30px] h-[30px] text-[#2E4A3A] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
    <path d="M12 2C7 6.5 4 12 4 17a8 8 0 0 0 16 0c0-5-3-10.5-8-15z" stroke-linecap="round" stroke-linejoin="round"></path>
    <path d="M12 2v20M12 7l5 3M12 12l5 3M12 17l4 2.5M12 7l-5 3M12 12l-5 3M12 17l-4 2.5" stroke-linecap="round" stroke-linejoin="round"></path>
  </svg>
  <div class="flex flex-col justify-center">
    <span class="font-headline-sm font-semibold tracking-[0.24em] text-[#2E4A3A] text-[19px] uppercase leading-none">
      WRAPTURE
    </span>
    <span class="font-label-caps tracking-[0.3em] font-semibold text-[#2E4A3A]/70 text-[11px] uppercase mt-1">
      INTELLIGENT PACKAGING
    </span>
  </div>
</div>

<!-- Dominant Editorial Typographic Statement in upper negative space -->
<div class="mt-10 max-w-[320px]">
  <h1 class="font-serif">
    <span class="block text-[42px] sm:text-5xl font-normal text-[#2E4A3A] tracking-[-0.02em] leading-[1.05]">
      Smart Packaging.
    </span>
    <span class="block text-[42px] sm:text-5xl italic font-normal text-[#2E4A3A]/90 tracking-[-0.02em] leading-[1.05] mt-1">
      Less Waste.
    </span>
  </h1>
</div></header>
<!-- Lower-middle & foreground viewport space intentionally left clear so the kraft box, travertine, and botanical foliage remain entirely tactile & visible -->
<div class="flex-1 pointer-events-none min-h-[160px]"></div>
<!-- Bottom Area: Understated supporting metadata & ambient launch indicator -->
<footer class="flex flex-col w-full space-y-3.5"><!-- Supporting Editorial Tracked Metadata -->
<div class="flex items-center justify-between w-full pb-2.5 border-b border-[#2E4A3A]/15">
  <span class="font-label-caps tracking-[0.22em] text-[10px] font-semibold uppercase text-[#2E4A3A]/90">
    AI PACKAGING INTELLIGENCE
  </span>
  <span class="font-label-caps tracking-[0.18em] text-[10px] font-medium uppercase text-[#2E4A3A]/75">
    PRODUCT → MATERIAL → PACKAGE
  </span>
</div>

<!-- Understated Premium CTA Button -->
<div class="w-full pt-1">
  <button type="button" class="w-full py-3.5 px-6 rounded-full bg-[#183325] text-[#FAF7F1] flex items-center justify-between shadow-lg shadow-[#183325]/15 hover:bg-[#2E4A3A] transition-all duration-300 group cursor-pointer">
    <span class="font-label-caps tracking-[0.2em] text-[12px] font-semibold uppercase text-[#FAF7F1]">
      Get Started
    </span>
    <span class="material-symbols-outlined text-[18px] text-[#FAF7F1] transition-transform duration-300 group-hover:translate-x-1">arrow_forward</span>
  </button>
</div>

<!-- Single subtle minimal progress shimmer indicator line -->
<div class="w-full pt-0.5">
  <div class="w-full h-[1.5px] bg-[#2E4A3A]/15 rounded-full overflow-hidden relative">
    <div class="w-24 h-full bg-[#2E4A3A]/80 rounded-full animate-shimmer"></div>
  </div>
</div></footer>
</main>
